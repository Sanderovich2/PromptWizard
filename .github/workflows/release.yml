name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tkinter
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Gate tests
        run: python -m pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: promptwizard-linux-x86_64
          - os: windows-latest
            asset: promptwizard-windows-x86_64.exe
          - os: macos-latest
            asset: promptwizard-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tkinter (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build
        run: python -m PyInstaller --noconfirm --clean packaging/promptwizard.spec

      - name: Smoke test the binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/promptwizard.exe --version
          else
            ./dist/promptwizard --version
          fi

      - name: Build the MSI (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --global wix --version 5.*
          export PATH="$PATH:$HOME/.dotnet/tools"
          version="${GITHUB_REF_NAME#v}"
          wix build installer/promptwizard.wxs \
            -d Version="$version" \
            -bindpath dist=dist \
            -o "dist/PromptWizard-${GITHUB_REF_NAME}-x64.msi"
          ls -l dist/

      - name: Name the assets for the release
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/promptwizard.exe "dist/${{ matrix.asset }}"
            mv dist/promptwizard-gui.exe "dist/promptwizard-gui-windows-x86_64.exe"
          else
            mv dist/promptwizard "dist/${{ matrix.asset }}"
            mv dist/promptwizard-gui "dist/$(basename "${{ matrix.asset }}")-gui"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" assets/* --clobber
          else
            gh release create "$tag" --title "PromptWizard $tag" --generate-notes assets/*
          fi
          gh release view "$tag" --json url --jq .url
