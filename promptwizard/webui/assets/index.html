<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PromptWizard</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="shell">

  <aside class="rail">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 64 64">
          <rect x="3.5" y="3.5" width="57" height="57" rx="11" fill="none" stroke="currentColor" stroke-width="4"/>
          <path d="M19 45 L43 21" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/>
          <path d="M43 21 L43 32 L32 21 Z" fill="var(--accent)"/>
          <circle cx="20" cy="20" r="3.2" fill="var(--accent)"/>
        </svg>
      </span>
      <span class="brand-text">
        <b data-i18n="app.name"></b>
        <i data-i18n="app.tagline"></i>
      </span>
    </div>

    <nav class="steps" aria-label="steps">
      <button type="button" class="step is-current" data-goto="prompt">
        <span class="no">1</span><span data-i18n="gui.tab_prompt"></span>
      </button>
      <button type="button" class="step" data-goto="analysis" disabled>
        <span class="no">2</span><span data-i18n="gui.tab_analysis"></span>
      </button>
      <button type="button" class="step" data-goto="questions" disabled>
        <span class="no">3</span><span data-i18n="gui.tab_questions"></span>
      </button>
      <button type="button" class="step" data-goto="result" disabled>
        <span class="no">4</span><span data-i18n="gui.tab_result"></span>
      </button>
    </nav>

    <div class="rail-foot">
      <label class="select">
        <span data-i18n="gui.language"></span>
        <select id="lang" aria-label="language"></select>
      </label>
      <p class="meta"><span data-i18n="gui.provider_label"></span> <b id="provider">-</b></p>
      <button type="button" id="open-settings" class="ghost wide" data-i18n="web.settings"></button>
      <p class="meta">v<span id="version">-</span></p>
    </div>
  </aside>

  <main class="work">
    <header class="work-head">
      <div class="head-text">
        <p class="eyebrow"><span data-i18n="gui.step"></span> <span id="step-index">1</span> / 4</p>
        <h2 id="step-title">-</h2>
        <p class="hint" id="step-hint"></p>
      </div>
      <div class="work-actions">
        <button type="button" id="restart" class="ghost" hidden data-i18n="gui.restart"></button>
        <button type="button" id="primary" class="primary">-</button>
      </div>
    </header>

    <section class="panel" id="panel-prompt">
      <textarea id="prompt" spellcheck="false" autocomplete="off"></textarea>
    </section>

    <section class="panel" id="panel-analysis" hidden>
      <div class="score">
        <span class="score-num" id="score">-</span>
        <p class="score-note" id="summary"></p>
      </div>
      <ol class="issues" id="issues"></ol>
      <p class="empty" id="issues-empty" hidden data-i18n="run.no_issues"></p>
    </section>

    <section class="panel" id="panel-questions" hidden>
      <ol class="questions" id="questions"></ol>
      <p class="empty" id="questions-empty" hidden data-i18n="gui.no_questions"></p>
    </section>

    <section class="panel" id="panel-result" hidden>
      <div class="result-head">
        <span class="badge" id="mode"></span>
        <div class="result-actions">
          <button type="button" id="copy" class="ghost" data-i18n="gui.copy"></button>
          <button type="button" id="download" class="ghost" data-i18n="gui.download"></button>
        </div>
      </div>
      <pre class="draft" id="draft"></pre>
      <h3 class="sub" data-i18n="gui.changes_label"></h3>
      <ol class="changes" id="changes"></ol>
    </section>

    <div class="notice" id="notice" hidden>
      <b id="notice-title"></b>
      <span id="notice-body"></span>
    </div>

    <footer class="status" aria-live="polite">
      <span id="status" data-i18n="gui.ready"></span>
      <span class="run-hint" data-i18n="gui.run_hint"></span>
    </footer>
  </main>
</div>

<aside class="drawer" id="drawer" hidden aria-label="settings">
  <header class="drawer-head">
    <h2 data-i18n="web.settings"></h2>
    <button type="button" id="close-settings" class="ghost icon" aria-label="close">&#215;</button>
  </header>

  <label class="field">
    <span data-i18n="web.theme"></span>
    <select id="theme">
      <option value="light" data-i18n="web.theme_light"></option>
      <option value="dark" data-i18n="web.theme_dark"></option>
      <option value="auto" data-i18n="web.theme_auto"></option>
    </select>
  </label>

  <label class="field">
    <span data-i18n="web.font"></span>
    <select id="font"></select>
  </label>

  <label class="field">
    <span data-i18n="web.font_size"></span>
    <input id="font-size" type="number" min="11" max="24" step="1">
  </label>

  <label class="check">
    <input type="checkbox" id="autostart">
    <span data-i18n="web.autostart"></span>
  </label>
  <p class="hint" id="autostart-note"></p>

  <details class="adv">
    <summary data-i18n="web.advanced"></summary>
    <label class="field"><span data-i18n="web.label_questions"></span><input id="set-max-questions" type="number" min="0" max="20"></label>
    <label class="field"><span data-i18n="web.label_temperature"></span><input id="set-temperature" type="number" min="0" max="2" step="0.1"></label>
    <label class="field"><span data-i18n="web.label_tokens"></span><input id="set-max-tokens" type="number" min="1"></label>
  </details>

  <label class="field">
    <span data-i18n="gui.provider_label"></span>
    <select id="provider-select"></select>
  </label>

  <label class="field">
    <span data-i18n="web.model"></span>
    <input id="model-input" list="model-list" autocomplete="off">
    <datalist id="model-list"></datalist>
  </label>
  <p class="hint" id="models-note"></p>
  <button type="button" id="settings-save" class="primary wide" data-i18n="web.save_settings"></button>
  <p class="hint" id="settings-note"></p>

  <hr>

  <h3 data-i18n="web.custom_provider"></h3>
  <p class="hint" data-i18n="web.custom_hint"></p>
  <label class="field"><span data-i18n="web.name"></span><input id="custom-name" placeholder="cerebras"></label>
  <label class="field"><span data-i18n="web.base_url"></span><input id="custom-base" placeholder="https://api.example.com/v1"></label>
  <label class="field"><span data-i18n="web.model"></span><input id="custom-model" placeholder="llama3.1-8b"></label>
  <label class="field"><span data-i18n="web.api_key_env"></span><input id="custom-key" placeholder="CEREBRAS_API_KEY"></label>
  <button type="button" id="custom-save" class="ghost wide" data-i18n="web.add_provider"></button>
  <p class="hint" id="custom-note"></p>
  <button type="button" id="open-config" class="ghost wide" data-i18n="web.open_config"></button>
  <p class="hint" id="config-path"></p>
</aside>

<script src="/assets/app.js"></script>
</body>
</html>
